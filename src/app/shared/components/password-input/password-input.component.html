<div class="input-wrapper">
  <img [ngSrc]="icon()" width="30" height="30" alt="icon" class="input-icon" />

  <input
    class="input-control"
    [type]="type"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="handleInput($event)"
  />

  <img
    [ngSrc]="iconEye"
    width="16"
    height="16"
    alt="icon"
    class="input-icon input-icon--click"
    (click)="toggleType()"
  />
</div>
