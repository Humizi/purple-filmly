<form class="login__form">
  <h2 class="login__title">Вход</h2>

  <form class="login__form-fields" [formGroup]="form">
    <app-input-component icon="icons/user.svg" placeholder="Email" formControlName="email" />

    <app-password-input-component
      icon="icons/lock.svg"
      placeholder="Пароль"
      formControlName="password"
    />
  </form>

  @if (error) {
    <div class="login__form--errors">{{ error }}</div>
  }

  <app-button text="Войти" (btnClick)="onLoginClick()" />
</form>
